name: Apply garden fix
on:
  push:
    paths:
      - .github/workflows/apply-garden-fix.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply verified source update
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib, json, hashlib, subprocess
          from pathlib import Path
          payload = json.loads(zlib.decompress(base64.b64decode(''))).decode())
          expected = payload['sha']
          def sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          current = Path('index.html').read_bytes()
          if sha(current) != 'f789193984e523e5483526ffcfb52d2eb137bbd0':
              raise SystemExit('Unexpected index.html version; refusing to overwrite newer work.')
          subprocess.run(['git','apply','--check','-'], input=payload['patch'], text=True, check=True)
          subprocess.run(['git','apply','-'], input=payload['patch'], text=True, check=True)
          for name, text in payload['files'].items():
              Path(name).write_text(text, encoding='utf-8')
          for name, expected_sha in expected.items():
              actual = sha(Path(name).read_bytes())
              if actual != expected_sha:
                  raise SystemExit(f'Hash mismatch for {name}: {actual}')
          print('All three prepared files verified.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile-fixes.css service-worker.js
          git rm -- .github/workflows/apply-garden-fix.yml
          git commit -m 'Fix Korean location search and simplify service worker caching'
          git push origin HEAD:main
