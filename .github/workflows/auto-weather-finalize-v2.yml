name: Auto-finalize observation weather v2

on:
  push:
    paths:
      - '.github/workflows/auto-weather-finalize-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app safely
        shell: python
        run: |
          from pathlib import Path

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          if 'const APP_VERSION = "1.11.0";' not in text:
              raise SystemExit('unexpected app version')
          text=text.replace('const APP_VERSION = "1.11.0";','const APP_VERSION = "1.12.0";',1)

          start=text.index('  async function fetchWeather(date){')
          end=text.index('  function renderWeatherTo(prefix,w){',start)
          replacement='''  async function fetchWeatherForStation(date,station){
            station=String(station||"");
            if(!validAsosStation(station))throw new Error("설정에서 ASOS 관측지점을 먼저 선택해 주세요.");
            if(!asosDateValid(date))throw new Error("조회 날짜를 확인해 주세요.");
            if(date>latestAsosDate())throw new Error("이 날짜의 확정 일자료는 아직 집계 중입니다. 관찰 기록은 먼저 저장하세요. 다음날 오전 11시 이후 앱을 열면 날씨가 자동으로 확정됩니다.");
            const params=new URLSearchParams({station,date});
            let res;
            try{res=await fetch(`${ASOS_URL}?${params}`,{signal:AbortSignal.timeout(15000)});}
            catch(error){throw new Error("기상청 날씨 서버에 연결하지 못했습니다. 네트워크를 확인하거나 잠시 후 다시 시도해 주세요.");}
            let json;
            try{json=await res.json();}catch{throw new Error("기상자료 응답을 읽지 못했습니다.");}
            if(!res.ok)throw new Error(typeof json.message==="string"?json.message:"기상자료를 불러오지 못했습니다.");
            return normalizeAsosWeather(json,date,station);
          }

          async function fetchWeather(date){return fetchWeatherForStation(date,state.project.stationId);}

          function isFinalAsosWeather(weather,date,station){
            if(!weather||weather.date!==date||weather.dataType!=="observation"||weather.source!=="기상청 ASOS")return false;
            return !station||String(weather.stationId||"")===String(station);
          }
          function observationWeatherStation(o){return String(o?.weatherStationId||o?.weather?.stationId||state.project.stationId||"");}
          function observationNeedsWeatherSync(o,latest=latestAsosDate()){
            if(!o||!asosDateValid(o.date)||o.date>latest)return false;
            const station=observationWeatherStation(o);
            if(!validAsosStation(station)||isFinalAsosWeather(o.weather,o.date,station))return false;
            if(o.weather&&o.weatherStatus!=="pending"&&o.weatherStatus!=="provisional")return false;
            return true;
          }
          function observationWeatherStatusText(o){
            const station=observationWeatherStation(o);
            if(isFinalAsosWeather(o?.weather,o?.date,station))return "✅ 기상청 확정 일자료";
            if(o?.weather&&o.weatherStatus!=="pending"&&o.weatherStatus!=="provisional")return o.weather.source||"저장된 기상 데이터";
            if(asosDateValid(o?.date)&&o.date>latestAsosDate())return "🕒 기상자료 집계 중 · 다음날 11시 이후 자동 확정";
            return "↻ 기상자료 업데이트 대기";
          }
          let weatherSyncRunning=false;
          async function syncPendingObservationWeather({silent=false,maxRequests=8}={}){
            if(weatherSyncRunning||!Array.isArray(state.observations)||!state.observations.length)return 0;
            weatherSyncRunning=true;
            try{
              const latest=latestAsosDate(), groups=new Map();
              for(const o of state.observations){
                if(!observationNeedsWeatherSync(o,latest))continue;
                const station=observationWeatherStation(o), key=`${station}|${o.date}`;
                if(!groups.has(key))groups.set(key,{station,date:o.date,ids:[]});
                groups.get(key).ids.push(o.id);
              }
              let requests=0,updated=0;
              for(const group of groups.values()){
                if(requests>=maxRequests)break;
                requests++;
                try{
                  const weather=await fetchWeatherForStation(group.date,group.station), ids=new Set(group.ids), now=new Date().toISOString();
                  state.observations=state.observations.map(o=>ids.has(o.id)?{...o,weather,weatherStatus:"final",weatherStationId:group.station,weatherUpdatedAt:now}:o);
                  updated+=group.ids.length;
                }catch(err){console.warn("observation weather sync skipped",group.date,group.station,err?.message||err);}
              }
              if(updated){saveState();if(!silent)toast(`✅ 기상청 확정 일자료 ${updated}건 자동 업데이트`);}
              return updated;
            }finally{weatherSyncRunning=false;}
          }

'''
          text=text[:start]+replacement+text[end:]

          ts=text.index('  async function renderTimeline('); te=text.index('  function renderBadges()',ts)
          block=text[ts:te]
          block=block.replace('      const weather=o.weather||{};\n','      const weather=o.weather||{};\n      const weatherStatus=observationWeatherStatusText(o);\n',1)
          block=block.replace('${weather.mean!=null?`평균 ${fmt(weather.mean)}℃ · 강수 ${fmt(weather.rain)}mm · 일조 ${fmt(weather.sun)}h`:"기상 데이터 없음"}','${weather.mean!=null?`평균 ${fmt(weather.mean)}℃ · 강수 ${fmt(weather.rain)}mm · 일조 ${fmt(weather.sun)}h · ${weatherStatus}`:weatherStatus}',1)
          text=text[:ts]+block+text[te:]

          ss=text.index('  async function saveObservation(e){'); se=text.index('  async function deleteObservation(id){',ss)
          block=text[ss:se]
          block=block.replace('      const obs={\n        id,\n        date:document.getElementById("obsDate").value,','''      const observationDate=document.getElementById("obsDate").value;
      const savedWeather=currentWeatherForObservation?.date===observationDate?currentWeatherForObservation:null;
      const weatherStationId=String(savedWeather?.stationId||old?.weatherStationId||state.project.stationId||"");
      const weatherStatus=savedWeather?(isFinalAsosWeather(savedWeather,observationDate,weatherStationId)?"final":(old?.weatherStatus||"legacy")):"pending";
      const obs={
        id,
        date:observationDate,''',1)
          block=block.replace('        weather:currentWeatherForObservation?.date===document.getElementById("obsDate").value?currentWeatherForObservation:null,\n        photoId,','''        weather:savedWeather,
        weatherStatus,
        weatherStationId,
        weatherUpdatedAt:savedWeather?new Date().toISOString():(old?.weatherUpdatedAt||null),
        photoId,''',1)
          block=block.replace('      setStatus("obsStatus", editId?"관찰 기록을 수정했습니다.":"관찰 기록을 저장했습니다. 사진도 기기 저장소에서 확인했습니다.","ok");\n      toast(editId?"수정 완료":"🌱 관찰 + 사진 저장 완료");','''      const weatherNotice=obs.weatherStatus==="pending"?" 날씨는 집계 중이며 다음날 오전 11시 이후 앱을 열면 자동으로 확정됩니다.":"";
      setStatus("obsStatus",(editId?"관찰 기록을 수정했습니다.":"관찰 기록을 저장했습니다.")+weatherNotice,"ok");
      toast(editId?"수정 완료":"🌱 관찰 기록 저장 완료");
      syncPendingObservationWeather({silent:true});''',1)
          text=text[:ss]+block+text[se:]

          text=text.replace('    requestPersistentStorage();loadTodayWeather();\n  });','    requestPersistentStorage();loadTodayWeather();syncPendingObservationWeather({silent:false});\n  });',1)
          text=text.replace('  document.getElementById("deleteAllBtn").addEventListener("click",deleteAll);\n\n  document.getElementById("obsDate").value=todayStr();','''  document.getElementById("deleteAllBtn").addEventListener("click",deleteAll);

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"&&validAsosStation(state.project.stationId))syncPendingObservationWeather({silent:false});
  });

  document.getElementById("obsDate").value=todayStr();''',1)
          text=text.replace('navigator.serviceWorker.register("/school-garden/service-worker.js?v=23"','navigator.serviceWorker.register("/school-garden/service-worker.js?v=24"',1)
          text=text.replace('  if(!state.project.cropName || !state.project.plantDate || !validAsosStation(state.project.stationId)) showSetup(true);\n  else loadTodayWeather();','  if(!state.project.cropName || !state.project.plantDate || !validAsosStation(state.project.stationId)) showSetup(true);\n  else { loadTodayWeather(); syncPendingObservationWeather({silent:false}); }',1)
          p.write_text(text,encoding='utf-8')

          sw=Path('service-worker.js'); swtext=sw.read_text(encoding='utf-8')
          if 'const CACHE = "school-garden-v14";' not in swtext: raise SystemExit('unexpected cache version')
          sw.write_text(swtext.replace('const CACHE = "school-garden-v14";','const CACHE = "school-garden-v15";',1),encoding='utf-8')
      - name: Verify syntax and behavior
        run: |
          node tests/asos-client.test.cjs
          node - <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm'), assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const app=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].at(-1)[1];
          new Function(app);
          assert.ok(html.includes('const APP_VERSION = "1.12.0";'));
          assert.ok(html.includes('🕒 기상자료 집계 중 · 다음날 11시 이후 자동 확정'));
          assert.ok(html.includes('weatherStatus:"final"'));
          assert.ok(html.includes('syncPendingObservationWeather({silent:false})'));
          assert.ok(html.includes('const STORAGE_KEY = "gardenClimateJournal.v1";'));
          assert.ok(html.includes('const DB_NAME = "gardenClimateJournalDB";'));
          console.log('PASS: app syntax and auto-finalize markers');
          NODE
      - name: Commit tested update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Auto-finalize saved observation weather"
          git push origin HEAD:main
