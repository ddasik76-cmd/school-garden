name: Apply garden fix retry
on:
  push:
    paths:
      - .github/workflows/apply-garden-fix-retry.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified source update
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib, json, hashlib, subprocess, re
          from pathlib import Path
          source = Path('.github/workflows/apply-garden-fix.yml').read_text()
          match = re.search(r"base64\.b64decode\('([A-Za-z0-9+/=]+)'\)", source)
          if not match or len(match.group(1)) != 7956:
              raise SystemExit('Prepared update payload is missing or incomplete.')
          payload = json.loads(zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8'))
          def sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if sha(Path('index.html').read_bytes()) != 'f789193984e523e5483526ffcfb52d2eb137bbd0':
              raise SystemExit('Unexpected index.html version; refusing to overwrite newer work.')
          subprocess.run(['git','apply','--check','-'], input=payload['patch'], text=True, check=True)
          subprocess.run(['git','apply','-'], input=payload['patch'], text=True, check=True)
          for name, text in payload['files'].items():
              if name not in ('mobile-fixes.css','service-worker.js'):
                  raise SystemExit('Unexpected file in update payload.')
              Path(name).write_text(text, encoding='utf-8')
          for name, expected_sha in payload['sha'].items():
              actual = sha(Path(name).read_bytes())
              if actual != expected_sha:
                  raise SystemExit(f'Hash mismatch for {name}: {actual}')
          print('All three prepared files verified.')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile-fixes.css service-worker.js
          git rm -- .github/workflows/apply-garden-fix.yml .github/workflows/apply-garden-fix-retry.yml
          git commit -m 'Fix Korean location search and simplify service worker caching'
          git push origin HEAD:main
