name: Apply ASOS migration
on:
  push:
    branches: [asos-integration]
    paths: [.github/workflows/asos-migrate.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration to verified source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/migrate-asos.py')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          matches=[i for i,line in enumerate(lines) if line.strip().startswith('actual=hashlib.sha1(')]
          assert len(matches)==1
          lines[matches[0]]="    actual=hashlib.sha1(b'blob '+str(len(original)).encode()+bytes([0])+original).hexdigest()"
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python tools/migrate-asos.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          script=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/school-garden.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/school-garden.js
          node --check service-worker.js
      - name: Run ASOS regression tests
        run: node tests/asos-client.test.cjs
      - name: Commit tested application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- tools/migrate-asos.py .github/workflows/asos-migrate.yml
          git add index.html service-worker.js tests/asos-client.test.cjs
          git commit -m "Switch garden weather to KMA ASOS observations"
          git push origin HEAD:asos-integration
